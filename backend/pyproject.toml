[project]
name = "orvix-backend"
version = "1.0.0"
description = "ORVIX Earth Intelligence Systems - Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.14.0",
    "opencv-python>=4.8.0",
    "pillow>=10.1.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "sentinelhub>=3.10.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
